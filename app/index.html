<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Cover Studio — GTA-style cover art maker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23ff2e88'/%3E%3Ctext x='16' y='23' font-size='20' font-weight='900' text-anchor='middle' fill='white'%3EV%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls">
    <h1>Vice Cover Studio</h1>
    <p class="tagline">Your photo, popped out of a GTA-style multi-panel cover. Everything runs on your machine — photos never leave it.</p>

    <label class="field">Hero photo (the pop-out person)
      <input id="heroPhoto" type="file" accept="image/*">
    </label>
    <label class="field">Photo for the selected panel
      <input id="panelPhoto" type="file" accept="image/*">
    </label>
    <button id="fillAll" type="button">Fill all empty panels with that photo</button>
    <p class="hint" id="panelLabel">Hero panel (the pop-out)</p>
    <p class="hint">Click a panel to select it, drag it to position its photo, scroll to zoom.</p>

    <label class="field">Caption
      <input id="caption" type="text" maxlength="40" value="Sunset Heist">
    </label>

    <div class="field">Colour grade
      <div class="grades">
        <button type="button" data-grade="sunset" class="active">Sunset</button>
        <button type="button" data-grade="neon">Neon</button>
        <button type="button" data-grade="coral">Coral Heat</button>
      </div>
    </div>

    <div class="field">Export PNG
      <div class="exports">
        <button type="button" data-export="0">1080 × 1080</button>
        <button type="button" data-export="1">1080 × 1350</button>
        <button type="button" data-export="2">1920 × 1080</button>
      </div>
      <button id="exportAll" type="button" class="primary">Export all three sizes</button>
    </div>
    <p id="status" role="status"></p>
  </section>
  <section class="preview">
    <canvas id="cover" width="1080" height="1080" aria-label="The cover"></canvas>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
